name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Read-only: these jobs only build and test. Nothing here needs write access,
# and they execute code from pull requests.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave GITHUB_TOKEN in .git/config where PR-authored test code
          # could read it. Nothing in this workflow pushes back to the repo.
          persist-credentials: false

      # PINNED, not `channel: stable`. Two reasons, both found the hard way when
      # this workflow first ran:
      #
      #  1. The repo does NOT currently build on Flutter 3.44.x. phosphor_flutter
      #     2.1.0 extends IconData, which became a `final class` in 3.44, so
      #     every widget test fails to compile:
      #       "The class 'IconData' can't be extended outside of its library
      #        because it's a final class."
      #     Upgrading past 3.41.x needs phosphor_flutter bumped or dropped first.
      #  2. CupertinoPageTransitionsBuilder moved between cupertino.dart and
      #     material.dart across those versions, so theme.dart's imports are
      #     version-sensitive too.
      #
      # A floating channel means the toolchain changes underneath an already
      # reviewed commit — the same reasoning as the commit-SHA pins for sibling
      # packages in pubspec.yaml. Bump this deliberately, with the phosphor
      # dependency sorted out in the same change. Every job below uses the
      # same pin.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # `flutter pub get` run locally WITH pubspec_overrides.yaml present
      # rewrites the tracked pubspec.lock to `path: ../analytics` and drops the
      # resolved-ref, so the lock stops recording which sibling commit was
      # actually tested. It is easy to do by accident — any local `flutter
      # build` or `flutter test` triggers it — and it has reached main before.
      # This runs BEFORE `pub get` so it inspects the committed file. Shared
      # with build.yml's `preflight` — a tag push never runs this workflow, so
      # the guard has to live there too to actually protect a release.
      - name: Guard — the lock pins sibling commits, and the pins aren't stale
        run: bash .github/scripts/check_sibling_pins.sh

      # Sibling packages resolve from their pinned commit SHAs in pubspec.yaml.
      # There is no pubspec_overrides.yaml here — that file is gitignored and
      # local-dev only — so CI tests exactly the pins a release would ship.
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  # Every test not tagged `golden`, split by FILE across three runners.
  #
  # `flutter test --total-shards` shards tests inside each file, so every
  # shard would still compile all ~470 files — and compiling is about half the
  # suite's time. `tool/test_shard.sh` hands each runner a disjoint third of
  # the files instead.
  #
  # --concurrency=4: each test file runs in its own process, and
  # test/flutter_test_config.dart gives every process its own SQLite
  # directory, so parallel files cannot share a database file.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The golden capture (whoop_hist.jsonl) is a real band recording kept
      # beside the repo rather than committed to it, so the derivation-replay
      # tests that need it SKIP here and run locally.
      - name: Test (shard ${{ matrix.shard }} of 3)
        run: >-
          bash tool/test_shard.sh ${{ matrix.shard }} 3
          --concurrency=4 --exclude-tags golden --reporter=expanded

  # Every `golden`-tagged test, pixels and all, on the host the masters were
  # rendered on: macOS 27 on Apple silicon. Text rasterization goes through
  # the host's font stack, so an older macOS lands every golden sub-1% off
  # (544 diffs, 0.03–0.58%, measured on macos-latest) and Ubuntu lands them a
  # median 2.4% off. `xcode-27` is GitHub's macOS 27 arm64 image.
  #
  # Comparison is exact. Failure images are uploaded for inspection.
  goldens:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Only the files that can hold golden tests (tool/golden_test_files.sh):
      # loading all ~470 files to find the ~65 with goldens took longer than
      # the goldens themselves. The script falls back to every file when the
      # tag could come from elsewhere, and fails on a pixel comparison without
      # the tag, so no golden test can drop out of both lanes.
      - name: Test (golden)
        run: |
          files=$(bash tool/golden_test_files.sh)
          cores=$(sysctl -n hw.ncpu)
          echo "cores: $cores, files: $(echo "$files" | wc -l)"
          # shellcheck disable=SC2086 # one path per word
          flutter test --no-pub --concurrency="$cores" --tags golden \
            --reporter=expanded $files

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 7

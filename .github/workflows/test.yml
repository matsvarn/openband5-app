name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_goldens:
        description: >-
          Re-render the golden masters on the xcode-27 runner and upload them
          as the golden-masters artifact, instead of comparing.
        type: boolean
        default: false

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Read-only: these jobs only build and test. Nothing here needs write access,
# and they execute code from pull requests.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave GITHUB_TOKEN in .git/config where PR-authored test code
          # could read it. Nothing in this workflow pushes back to the repo.
          persist-credentials: false

      # PINNED, not `channel: stable`. Two reasons, both found the hard way when
      # this workflow first ran:
      #
      #  1. The repo does NOT currently build on Flutter 3.44.x. phosphor_flutter
      #     2.1.0 extends IconData, which became a `final class` in 3.44, so
      #     every widget test fails to compile:
      #       "The class 'IconData' can't be extended outside of its library
      #        because it's a final class."
      #     Upgrading past 3.41.x needs phosphor_flutter bumped or dropped first.
      #  2. CupertinoPageTransitionsBuilder moved between cupertino.dart and
      #     material.dart across those versions, so theme.dart's imports are
      #     version-sensitive too.
      #
      # A floating channel means the toolchain changes underneath an already
      # reviewed commit — the same reasoning as the commit-SHA pins for sibling
      # packages in pubspec.yaml. Bump this deliberately, with the phosphor
      # dependency sorted out in the same change. Every job below uses the
      # same pin.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # `flutter pub get` run locally WITH pubspec_overrides.yaml present
      # rewrites the tracked pubspec.lock to `path: ../analytics` and drops the
      # resolved-ref, so the lock stops recording which sibling commit was
      # actually tested. It is easy to do by accident — any local `flutter
      # build` or `flutter test` triggers it — and it has reached main before.
      # This runs BEFORE `pub get` so it inspects the committed file. Shared
      # with build.yml's `preflight` — a tag push never runs this workflow, so
      # the guard has to live there too to actually protect a release.
      - name: Guard — the lock pins sibling commits, and the pins aren't stale
        run: bash .github/scripts/check_sibling_pins.sh

      # Sibling packages resolve from their pinned commit SHAs in pubspec.yaml.
      # There is no pubspec_overrides.yaml here — that file is gitignored and
      # local-dev only — so CI tests exactly the pins a release would ship.
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  # Every test, split by FILE across three runners.
  #
  # `flutter test --total-shards` shards tests inside each file, so every
  # shard would still compile all ~470 files — and compiling is about half the
  # suite's time. `tool/test_shard.sh` hands each runner a disjoint third of
  # the files instead.
  #
  # Golden-tagged tests run here too, with OPENBAND_TEST_LANE=behavior: their
  # assertions run and their image comparisons accept (Ubuntu renders text
  # about 2.4% differently from the macOS masters). The `goldens` job compares
  # the pixels. Running the bodies here means a golden test the macOS job
  # does not load still runs somewhere.
  #
  # --concurrency=4: each test file runs in its own process, and
  # test/flutter_test_config.dart gives every process its own SQLite
  # directory, so parallel files cannot share a database file.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The golden capture (whoop_hist.jsonl) is a real band recording kept
      # beside the repo rather than committed to it, so the derivation-replay
      # tests that need it SKIP here and run locally.
      - name: Test (shard ${{ matrix.shard }} of 3)
        env:
          OPENBAND_TEST_LANE: behavior
        run: >-
          bash tool/test_shard.sh ${{ matrix.shard }} 3
          --concurrency=4 --reporter=expanded

  # Every test in every file that compares pixels, with the exact comparator,
  # on the host the masters were rendered on: macOS 27 on Apple silicon. Text
  # rasterization goes through the host's font stack, so an older macOS lands
  # every golden sub-1% off (544 diffs, 0.03–0.58%, measured on macos-latest)
  # and Ubuntu lands them a median 2.4% off. `xcode-27` is GitHub's macOS 27
  # arm64 image, still a public preview. Comparison is exact. Failure images
  # are uploaded for inspection.
  #
  # When GitHub moves the image. The sign is this job failing across many
  # files with sub-1% diffs on a change that touches no UI, while the
  # "Runner Image" group at the top of the job log shows a new xcode-27-arm64
  # version. Confirm in the golden-failures artifact that only text edges
  # differ, then re-render the masters on the runner itself (a local Mac only
  # matches if it runs the same macOS build):
  #
  #   gh workflow run test.yml --ref BRANCH -f update_goldens=true
  #   gh run download RUN_ID -n golden-masters -D test/openband_goldens
  #
  # Review the changed PNGs before committing them, and name the image
  # version in the commit message. Without a moved image, a failing golden is
  # a real change: fix the UI or re-render deliberately.
  goldens:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Only the files that call matchesGoldenFile (tool/golden_test_files.sh):
      # loading all ~470 files took longer than the goldens themselves. Every
      # test in them runs, not just the golden-tagged ones, so a comparison is
      # checked however its test is tagged. The script fails if a helper
      # outside the test files compares pixels, since it could not find the
      # callers.
      - name: Test (golden)
        run: |
          files=$(bash tool/golden_test_files.sh)
          cores=$(sysctl -n hw.ncpu)
          echo "cores: $cores, files: $(echo "$files" | wc -l)"
          # shellcheck disable=SC2086 # one path per word
          flutter test --no-pub --concurrency="$cores" \
            ${{ inputs.update_goldens && '--update-goldens' || '' }} \
            --reporter=expanded $files

      - name: Upload re-rendered masters
        if: inputs.update_goldens
        uses: actions/upload-artifact@v4
        with:
          name: golden-masters
          path: test/openband_goldens/
          retention-days: 7

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 7
